; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32cam_esp32s3_n16r8_typec

[env]
platform = espressif32
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = log2file, time, default, esp32_exception_decoder
build_flags = 
	-Ofast
	-D 'BOARD_NAME="${this.board}"'
	-D 'CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
	-D 'IOTWEBCONF_PASSWORD_LEN=64'
	-D 'CONFIG_ESP32S3_SPIRAM_SUPPORT=1'
	-D 'CONFIG_SPIRAM_MODE_OCT=1'
	-D 'CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=6'
	-D 'CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=12'
	-D 'CONFIG_SPIRAM_USE=1'
	-D 'CONFIG_SPIRAM_CACHE_WORKAROUND=1'
	-D 'CONFIG_SPIRAM_USE_MALLOC=1'
	-D 'CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=16384'
	-D 'CONFIG_CAMERA_CORE0_SPINLOCK_TIMEOUT_MS=100'
	-D 'CONFIG_ESP_WIFI_STATIC_TX_BUFFER_NUM=2'
	-D 'CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=8'
	-D 'CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=0'
	-D 'CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=0'
	-D ARDUINO_USB_MODE=1	-D ARDUINO_USB_CDC_ON_BOOT=1
board_build.embed_txtfiles = 
	html/index.min.html
lib_deps = 
	prampec/IotWebConf@^3.2.1
	geeksville/Micro-RTSP@^0.1.6
	rzeldent/micro-moustache@^1.0.1

[env:esp32cam_esp32s3_n16r8_typec]
board = esp32cam_esp32s3_n16r8_typec
lib_deps = 
	prampec/IotWebConf@^3.2.1
	espressif/esp32-camera@^2.0.4
	geeksville/Micro-RTSP@^0.1.6
	rzeldent/micro-moustache@^1.0.1
